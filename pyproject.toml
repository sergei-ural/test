[tool.poetry]
name = "booking-app"
version = "0.1.0"
description = ""
authors = []
packages = [
    { include = "domain", from = "src" },
    { include = "adapters", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.12"
sqlalchemy = "^2.0"
alembic = "^1.14"
pydantic-settings = "^2.7"
aiosqlite = "^0.21"
asyncpg = "^0.30"
psycopg2-binary = "^2.9"
celery = { version = "^5.4", extras = ["redis"] }
fastapi = "^0.115"
uvicorn = { version = "^0.34", extras = ["standard"] }
tenacity = "^9.1.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.25"
pytest-mock = "^3.15.1"
httpx = "^0.28"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that require docker compose services",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
